<!DOCTYPE html>
<html lang="en" class="bg-black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Guru Maheswar | Software Developer</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&family=Space+Grotesk:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind Custom Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', "monospace"],
              sans: ['"Space Grotesk"', "sans-serif"],
            },
            colors: {
              matrix: "#00ff41",
              void: "#050505",
            },
            animation: {
              blink: "blink 1s step-end infinite",
              scan: "scan 6s linear infinite",
              glitch: "glitch 1s linear infinite",
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              blink: {
                "0%, 100%": { opacity: "1" },
                "50%": { opacity: "0" },
              },
              scan: {
                "0%": { top: "0%" },
                "100%": { top: "100%" },
              },
              glitch: {
                "2%, 64%": { transform: "translate(2px,0)" },
                "4%, 60%": { transform: "translate(-2px,0)" },
                "62%": { transform: "translate(0,0) skew(5deg)" },
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>

    <!-- Custom Styles -->
    <style>
      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border: 1px solid #000;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #fff;
      }

      /* Grid Background */
      .bg-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, #222 1px, transparent 1px),
          linear-gradient(to bottom, #222 1px, transparent 1px);
      }

      /* CRT Scanline Overlay */
      .scanline::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 2;
      }

      /* Moving Scan Bar */
      .scanline-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.05);
        animation: scan 6s linear infinite;
        pointer-events: none;
        z-index: 3;
      }
    </style>
  </head>

  <body
    class="bg-black text-white antialiased overflow-x-hidden selection:bg-white selection:text-black"
  >
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
